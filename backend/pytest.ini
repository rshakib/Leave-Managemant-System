[pytest]
# So `pytest -q` run from backend/ can import the `app` package.
pythonpath = .
testpaths = tests
# The integration marker needs a REAL Postgres whose database name ends with
# "_test" (see tests/integration/conftest.py). It is excluded by default so a
# plain "pytest -q" never touches a database.
markers =
    integration: needs a throw-away Postgres database ending in _test
addopts = -m "not integration"
