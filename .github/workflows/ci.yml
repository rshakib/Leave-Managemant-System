name: CI

on:
  push:
  pull_request:

# Least privilege: the workflow only reads the repository.
# CI never receives Supabase or SMTP credentials, and uses no secrets at all.
permissions:
  contents: read

env:
  # A throw-away value for Settings; nothing in CI talks to a real database
  # except the postgres service containers below.
  APP_ENV: test

jobs:
  backend:
    name: Backend unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      # Pinning to full commit SHAs is a later hardening step; a major version
      # is enough for now.
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Unit tests (integration marker excluded)
        run: pytest -q
      - name: Dependency audit (non-blocking)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  migrations:
    name: Migrations match the models
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: lms_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/lms_ci
      JWT_SECRET: ci-only-not-a-real-secret-ci-only
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt
      - name: Apply the migrations to an empty database
        run: alembic upgrade head
      - name: Fail when the models and the migrations disagree
        run: alembic check

  frontend:
    name: Frontend lint, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Dependency audit (non-blocking)
        continue-on-error: true
        run: npm audit --audit-level=high

  integration:
    name: Golden path (real Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: lms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The safety guard in tests/integration/conftest.py only allows a host of
      # localhost/127.0.0.1/postgres and a database name ending in "_test".
      DATABASE_URL: postgresql://ci:ci@localhost:5432/lms_test
      JWT_SECRET: ci-only-not-a-real-secret-ci-only
      APP_ENV: test
      EMAIL_BACKEND: file
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: alembic upgrade head
      - run: pytest -m integration -q

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No tracked .env, venv, node_modules or private keys
        run: |
          set -e
          tracked_env=$(git ls-files | grep -E '(^|/)\.env$' || true)
          if [ -n "$tracked_env" ]; then
            echo "A .env file is tracked by git: $tracked_env"
            exit 1
          fi
          heavy=$(git ls-files | grep -E '(^|/)(venv|node_modules|dist)/' || true)
          if [ -n "$heavy" ]; then
            echo "Build output or dependencies are tracked: $heavy"
            exit 1
          fi
          keys=$(git ls-files | grep -Ei '(^|/)(id_rsa|id_ed25519|id_ecdsa|.*\.pem|.*\.key)$' || true)
          if [ -n "$keys" ]; then
            echo "A private key looks tracked: $keys"
            exit 1
          fi
          echo "Hygiene OK"
